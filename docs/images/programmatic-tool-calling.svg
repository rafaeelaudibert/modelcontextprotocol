er-end="url(#a2)"/><text x="570" y="763" class="msg grn" text-anchor="middle">createIssue({ title: &quot;Error: null ref&quot; })</text><line x1="800" x2="340" y1="802" y2="802" stroke="#18E299" stroke-width="1.2" marker-end="url(#a2)"/><text x="570" y="795" class="msg grn" text-anchor="middle">{ issueId: &quot;T-102&quot; }</text><text x="570" y="830" class="note" text-anchor="middle">… all iterations happen inside the sandbox …</text><line x1="340" x2="122" y1="858" y2="858" stroke="#09090b" stroke-width="1.2" marker-end="url(#a1)"/><rect width="208" height="26" x="140" y="844" fill="#ecfdf5" stroke="#a7f3d0" rx="5"/><text x="244" y="861" class="msg grn" text-anchor="middle">&quot;Filed 12 tickets from 2,000 logs&quot;</text><rect width="216" height="32" x="640" y="844" fill="#18181b" rx="6"/><text x="748" y="865" fill="#18E299" class="stat" text-anchor="middle">~15 tokens returned</text><defs><marker id="a1" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#09090b" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a2" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#18E299" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs></svg>