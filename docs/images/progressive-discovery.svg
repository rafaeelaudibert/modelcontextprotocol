<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 760 440"><style>text{font-family:system-ui,-apple-system,sans-serif}.heading,.title{font-weight:600}.title{font-size:13px;fill:#09090b}.heading{font-size:11px;fill:#fff}.sub{font-size:9.5px;fill:#52525b}.dim{font-size:9px;fill:#71717a}.mono{font-size:9.5px;fill:#09090b;font-family:ui-monospace,monospace}.bold{font-size:11px;font-weight:600;fill:#09090b}.green{fill:#065f46}</style><rect width="760" height="440" fill="#fafafa" stroke="#e4e4e7" rx="8"/><text x="380" y="28" class="title" text-anchor="middle">Progressive Discovery: Load Tools On Demand</text><rect width="350" height="374" x="20" y="46" fill="#fff" stroke="#e4e4e7" rx="6"/><rect width="350" height="28" x="20" y="46" fill="#18181b" rx="6"/><rect width="350" height="6" x="20" y="68" fill="#18181b"/><text x="195" y="65" class="heading" text-anchor="middle">✗ All tools loaded upfront</text><rect width="310" height="22" x="40" y="88" fill="#f4f4f5" stroke="#e4e4e7" rx="3"/><text x="52" y="103" class="mono">gdrive.getDocument — schema, params…</text><rect width="310" height="22" x="40" y="114" fill="#f4f4f5" stroke="#e4e4e7" rx="3"/><text x="52" y="129" class="mono">gdrive.listFiles — schema, params…</text><rect width="310" height="22" x="40" y="140" fill="#f4f4f5" stroke="#e4e4e7" rx="3"/><text x="52" y="155" class="mono">gdrive.shareFile — schema, params…</text><rect width="310" height="22" x="40" y="166" fill="#f4f4f5" stroke="#e4e4e7" rx="3"/><text x="52" y="181" class="mono">slack.postMessage — schema, params…</text><rect width="310" height="22" x="40" y="192" fill="#f4f4f5" stroke="#e4e4e7" rx="3"/><text x="52" y="207" class="mono">slack.getChannels — schema, params…</text><rect width="310" height="22" x="40" y="218" fill="#f4f4f5" stroke="#e4e4e7" rx="3"/><text x="52" y="233" class="mono">salesforce.query — schema, params…</text><rect width="310" height="22" x="40" y="244" fill="#f4f4f5" stroke="#e4e4e7" rx="3"/><text x="52" y="259" class="mono">salesforce.updateRecord — schema…</text><text x="195" y="284" class="dim" text-anchor="middle">… 150+ more tool definitions …</text><rect width="310" height="24" x="40" y="298" fill="#ecfdf5" stroke="#a7f3d0" rx="3"/><text x="52" y="314" class="mono green">User: &quot;Get my doc and update the lead&quot;</text><text x="195" y="352" class="bold" text-anchor="middle">~150,000 tokens</text><text x="195" y="366" class="sub" text-anchor="middle">before the model reads the request</text><rect width="310" height="8" x="40" y="382" fill="#f4f4f5" rx="4"/><rect width="295" height="8" x="40" y="382" fill="#18181b" rx="4"/><text x="195" y="406" class="dim" text-anchor="middle">High % context consumed by definitions</text><rect width="350" height="374" x="390" y="46" fill="#fff" stroke="#e4e4e7" rx="6"/><rect width="350" height="28" x="390" y="46" fill="#18181b" rx="6"/><rect width="350" height="6" x="390" y="68" fill="#18181b"/><text x="565" y="65" fill="#18E299" class="heading" text-anchor="middle">✓ Tools discovered on demand</text><rect width="310" height="62" x="410" y="88" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/><text x="422" y="106" class="bold green">① Catalog</text><text x="422" y="122" class="mono">search_tools(&quot;salesforce update&quot;)</text><text x="422" y="136" class="sub">→ salesforce.updateRecord</text><text x="422" y="148" class="sub">→ salesforce.query</text><line x1="565" x2="565" y1="150" y2="162" stroke="#a1a1aa" stroke-width="1" marker-end="url(#arr)"/><rect width="310" height="50" x="410" y="162" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/><text x="422" y="180" class="bold green">② Inspect</text><text x="422" y="196" class="mono">get_tool_details(&quot;salesforce.updateRecord&quot;)</text><text x="422" y="208" class="sub">→ full schema, params, return type</text><line x1="565" x2="565" y1="212" y2="224" stroke="#a1a1aa" stroke-width="1" marker-end="url(#arr)"/><rect width="310" height="50" x="410" y="224" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/><text x="422" y="242" class="bold green">③ Call</text><text x="422" y="258" class="mono">salesforce.updateRecord({...})</text><text x="422" y="270" class="sub">→ execute with full context</text><text x="565" y="310" class="bold green" text-anchor="middle">~2,000 tokens</text><text x="565" y="324" class="sub" text-anchor="middle">only the tools needed for this task</text><rect width="310" height="8" x="410" y="346" fill="#f4f4f5" rx="4"/><rect width="20" height="8" x="410" y="346" fill="#18E299" rx="4"/><text x="565" y="370" class="dim" text-anchor="middle">Minimal % context consumed by definitions</text><defs><marker id="arr" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#a1a1aa" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs></svg>