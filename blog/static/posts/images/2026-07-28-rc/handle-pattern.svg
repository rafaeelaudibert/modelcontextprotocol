<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,sans-serif" viewBox="0 0 640 340"><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="var(--fg)" d="M0,0 L10,5 L0,10 z"/></marker></defs><style>:root{--fg:#18181b;--muted:#71717a;--line:#d4d4d8;--accent:#0ea5e9}@media (prefers-color-scheme:dark){:root{--fg:#e4e4e7;--muted:#a1a1aa;--line:#3f3f46;--accent:#38bdf8}}.head,.lane{stroke-width:1.5}.lane{stroke:var(--line)}.head{fill:none;stroke:var(--fg);rx:8}.hlbl{fill:var(--fg);font-size:14px;text-anchor:middle;dominant-baseline:middle;font-weight:500}.msg{stroke:var(--fg);stroke-width:1.5;fill:none}.mlbl{fill:var(--fg);font-size:13px;text-anchor:middle;font-family:ui-monospace,Menlo,monospace}.hndl{fill:var(--accent);font-weight:600}.cap{fill:var(--muted);font-size:12px;text-anchor:middle}.cap .hndl{font-family:ui-monospace,Menlo,monospace}</style><rect width="120" height="34" x="80" y="20" class="head"/><text x="140" y="37" class="hlbl">Model</text><rect width="120" height="34" x="440" y="20" class="head"/><text x="500" y="37" class="hlbl">MCP server</text><line x1="140" x2="140" y1="54" y2="280" class="lane"/><line x1="500" x2="500" y1="54" y2="280" class="lane"/><text x="320" y="90" class="mlbl">create_basket()</text><line x1="140" x2="500" y1="102" y2="102" marker-end="url(#arr)" class="msg"/><text x="320" y="160" class="mlbl">{ basket_id: <tspan class="hndl">&quot;b_123&quot;</tspan> }</text><line x1="500" x2="140" y1="172" y2="172" marker-end="url(#arr)" class="msg"/><text x="320" y="230" class="mlbl">add_item(basket_id: <tspan class="hndl">&quot;b_123&quot;</tspan>, sku: …)</text><line x1="140" x2="500" y1="242" y2="242" marker-end="url(#arr)" class="msg"/><text x="320" y="310" class="cap">The model threads <tspan class="hndl">&quot;b_123&quot;</tspan> back as an ordinary argument</text></svg>